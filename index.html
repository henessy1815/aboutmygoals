<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김남일 — 부트캠프 목표, 알약맵 프로젝트, 배우고 싶은 것, 앞으로의 아이디어" />
    <title>김남일 | About My Goals</title>

    <!--
      테마 깜빡임 방지: React보다 먼저 실행되어 <html data-theme>을 정해 둡니다.
      저장된 선택이 있으면 그것을, 없으면 OS 설정을 따릅니다.
      저장 키 'theme'은 src/hooks/useTheme.ts와 같아야 합니다.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!-- 본문 글꼴 Pretendard: 페이지에 쓰인 글자 묶음만 내려받는 버전 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
